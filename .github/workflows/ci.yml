name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - run: pnpm install --no-frozen-lockfile
      - name: 导出 lockfile 差异
        run: |
          git diff -- pnpm-lock.yaml | gzip -9 | base64 -w0
          echo
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browser-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm e2e
